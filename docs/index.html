<style>
:root{
  --bg:#f7f8fc; --card:#ffffff; --text:#14172b; --muted:#5f6680; --line:#e6e9f3;
  --accent:#2563eb; --accent2:#7c3aed; --accent-weak:#e8efff; --danger:#e23d3d; --ok:#22c55e;
  --grad:linear-gradient(120deg,#2563eb 0%,#7c3aed 100%);
  --glow1:rgba(124,58,237,.10); --glow2:rgba(37,99,235,.08);
  --input:#f2f4fa; --shadow:0 1px 2px rgba(30,41,90,.04),0 8px 24px rgba(30,41,90,.07);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1020; --card:#181b2e; --text:#eceef8; --muted:#9ba2bd; --line:#2a2e45;
    --accent:#6b9bff; --accent2:#a78bfa; --accent-weak:#1f2650; --danger:#ff6b6b; --ok:#4ade80;
    --grad:linear-gradient(120deg,#4f7dff 0%,#9b6dff 100%);
    --glow1:rgba(155,109,255,.14); --glow2:rgba(79,125,255,.10);
    --input:#21253b; --shadow:0 8px 24px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1020; --card:#181b2e; --text:#eceef8; --muted:#9ba2bd; --line:#2a2e45;
  --accent:#6b9bff; --accent2:#a78bfa; --accent-weak:#1f2650; --danger:#ff6b6b; --ok:#4ade80;
  --grad:linear-gradient(120deg,#4f7dff 0%,#9b6dff 100%);
  --glow1:rgba(155,109,255,.14); --glow2:rgba(79,125,255,.10);
  --input:#21253b; --shadow:0 8px 24px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--text);
  background:radial-gradient(60% 40% at 100% 0%,var(--glow1),transparent 70%),radial-gradient(50% 35% at 0% 12%,var(--glow2),transparent 70%),var(--bg);
  background-attachment:fixed;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  padding-bottom:calc(40px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:8px;padding:12px 0 8px}
.top h1{font-size:20px;margin:0;flex:1;font-weight:800;letter-spacing:-.3px}
.top h1 .gt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.icon-btn{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:10px;width:40px;height:40px;
  display:grid;place-items:center;cursor:pointer;font-size:18px}
.tabs{display:flex;background:var(--card);border-radius:14px;border:1px solid var(--line);padding:4px;box-shadow:var(--shadow)}
.tabs button{flex:1;border:0;background:none;padding:8px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:600}
.tabs button[aria-selected="true"]{background:var(--grad);color:#fff;box-shadow:0 4px 12px color-mix(in srgb,var(--accent2) 30%,transparent)}
.navrow{display:flex;align-items:center;gap:8px;padding:10px 0}
.navrow .label{text-align:center;font-weight:700}
.labelwrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.todaybtn{border:0;background:var(--grad);color:#fff;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700;cursor:pointer}
.todaybtn[hidden]{display:none}
.navrow .sub{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.note{background:var(--accent-weak);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px}
.day{background:var(--card);border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);margin-bottom:10px;padding:12px 14px}
.day.past:not(.editing){opacity:.85}
.datepick{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.datepick input{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font:inherit;color:inherit}
.pastlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.pastlist button{border:0;background:var(--accent-weak);color:var(--accent);border-radius:8px;padding:6px 10px;cursor:pointer;font-weight:600;font-size:13px}
.day.editing{outline:2px solid var(--accent)}
.dhead{display:flex;align-items:center;gap:8px;min-height:32px}
.date{font-weight:700}
.date.sun{color:var(--danger)} .date.sat{color:var(--accent)}
.badge{font-size:11px;font-weight:700;background:var(--accent);color:#fff;border-radius:6px;padding:1px 6px}
.dhead .sp{flex:1}
.pencil{border:0;background:var(--input);border-radius:9px;width:36px;height:32px;cursor:pointer;font-size:16px}
.list{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.list li{display:flex;gap:10px;align-items:baseline}
.list .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:92px}
.list .r{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.list .memo-i{color:var(--muted);font-size:14px}
.body{margin-top:10px;display:grid;gap:8px}
.ev{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;background:var(--input);border-radius:10px;padding:8px}
.ev input{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 8px;min-width:0;width:100%}
.ev .times{grid-column:1;grid-row:1;display:flex;align-items:center;gap:6px;color:var(--muted)}
.ev .times input{flex:1}
.ev .title,.ev .remind{grid-column:1/3}
.ev .remind{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap}
.ev .del{grid-column:2;grid-row:1;border:0;background:none;color:var(--danger);font-size:22px;line-height:1;cursor:pointer;padding:4px 8px}
.add{border:1px dashed var(--line);background:none;border-radius:10px;padding:8px;cursor:pointer;color:var(--accent);font-weight:600}
.memo label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.memo input{width:100%;border:1px solid var(--line);background:var(--input);border-radius:8px;padding:8px}
.actions{display:flex;gap:8px;justify-content:flex-end}
.actions .btn{min-width:84px}
.empty{color:var(--muted);font-size:13px;margin-top:6px}
.classes{margin-top:6px;font-size:12px;color:var(--muted);line-height:1.6}
.classes b{color:var(--text);font-weight:600}
.repbtn{border:0;background:var(--input);border-radius:9px;height:32px;padding:0 10px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
.repbtn.has{background:var(--accent-weak);color:var(--accent)}
.rsec{margin-top:14px}
.rsec h3{font-size:14px;margin:0 0 6px;color:var(--muted);font-weight:700}
.rsec ul{margin:0;padding-left:20px} .rsec li{margin:2px 0}
.subj{background:var(--input);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.subj b{display:block;margin-bottom:2px}
.pre{white-space:pre-wrap;word-break:break-word}
.rform label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:12px 0 4px}
.rform textarea,.rform input{width:100%;border:1px solid var(--line);background:var(--input);border-radius:8px;padding:8px;font:inherit;color:inherit}
.rform textarea{min-height:76px;resize:vertical}
.rform .hint{font-weight:400;font-size:12px}
.sedit{background:var(--input);border-radius:10px;padding:8px;margin-bottom:6px;display:grid;grid-template-columns:1fr auto;gap:6px}
.sedit input,.sedit textarea{background:var(--card)}
.sedit textarea{grid-column:1/3;min-height:64px}
.sedit .del{border:0;background:none;color:var(--danger);font-size:22px;cursor:pointer;padding:0 8px}
.tabs button{padding:8px 0;font-size:15px}
.lbl{font-size:13px;font-weight:700;color:var(--muted);margin-top:4px}
.jak{font-size:11px;font-weight:700;background:var(--accent-weak);color:var(--accent);border-radius:6px;padding:2px 6px}
.day.box{border-top:4px solid #f3efc9}
.tasks{margin-top:8px}
.task{align-items:center!important}
.task.done span{text-decoration:line-through;color:var(--muted)}
.chk{flex:none;width:22px;height:22px;border-radius:6px;border:2px solid var(--line);background:var(--card);cursor:pointer;
  display:grid;place-items:center;font-size:13px;font-weight:900;color:#fff;padding:0}
.chk.on{background:var(--ok);border-color:var(--ok)}
.trow{display:flex;gap:6px;align-items:center;background:var(--input);border-radius:10px;padding:6px 8px}
.trow input{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 8px}
.trow .del,.grow .del{border:0;background:none;color:var(--danger);font-size:22px;line-height:1;cursor:pointer;padding:2px 6px}
.sec .blist{margin:6px 0 0;padding-left:20px} .sec .blist li{margin:3px 0}
.sec.goal{background:linear-gradient(var(--card),var(--card)) padding-box;border-left:5px solid #e8eaa0}
.sbox{width:100%;min-height:96px;border:1px solid var(--line);background:var(--input);border-radius:8px;padding:8px;font:inherit;color:inherit;resize:vertical;margin-top:6px}
.gtab{width:100%;border-collapse:collapse;margin-top:6px;font-size:14px;background:#fbfbef}
.gtab th{font-size:11px;color:var(--muted);font-weight:700;text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
.gtab td{padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
.gtab td:first-child{font-weight:700;white-space:nowrap}
.gtab td:last-child{white-space:nowrap;color:var(--muted);font-size:13px}
.must{margin-top:10px;background:#fbfbef;border-radius:8px;padding:8px 10px}
.must b{font-size:12px;color:var(--muted)}
.grow{display:grid;grid-template-columns:72px 1fr 56px auto;gap:6px;align-items:center;background:var(--input);border-radius:10px;padding:6px}
.grow input{min-width:0;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 6px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .gtab,:root:not([data-theme="light"]) .must{background:var(--input)} :root:not([data-theme="light"]) .day.box{border-top-color:#3a3a22}}
:root[data-theme="dark"] .gtab,:root[data-theme="dark"] .must{background:var(--input)}
.cal{padding:10px 8px}
.cal-h,.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-h span{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding-bottom:4px}
.sun{color:var(--danger)!important} .sat{color:var(--accent)!important}
.cell{position:relative;min-height:64px;border:1px solid var(--line);border-radius:6px;background:var(--card);padding:2px 2px 3px;text-align:left;
  display:flex;flex-direction:column;gap:1px;overflow:hidden;cursor:pointer;color:var(--text)}
.cell.blank{border:0;background:none;cursor:default}
.cell .n{font-size:12px;font-weight:700}
.cell.sun .n{color:var(--danger)} .cell.sat .n{color:var(--accent)}
.cell.today{border-color:var(--accent);border-width:2px}
.cell.sel{background:var(--accent-weak)}
.cell.exam{background:#fdf8d7} .cell.exam.sel{background:var(--accent-weak)}
.ci{font-size:9.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.ci.ce{color:var(--text)} .ci.sys{color:var(--danger)} .ci.more{color:var(--accent)}
.rdot{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.year .ybig{font-size:40px;font-weight:800;color:#b9cf8a;text-align:center;letter-spacing:2px}
.ygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 8px;margin-top:6px}
.mini .mt{text-align:center;font-weight:700;font-size:13px;margin-bottom:2px}
.mh,.mg{display:grid;grid-template-columns:repeat(7,1fr)}
.mh span{font-size:8.5px;text-align:center;color:var(--muted)}
.mg button,.mg span{font-size:10px;text-align:center;padding:2px 0;border:0;background:none;cursor:pointer;color:var(--text);border-radius:4px;font-variant-numeric:tabular-nums}
.mg .today{background:var(--accent);color:#fff!important;font-weight:800}
.mg .exam{background:#f6ef9e}
.mg .note{text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:2px}
.mg .rep{font-weight:800}
.mg .vac{color:var(--muted);background:var(--input)}
.cell.vac{background:var(--input)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:12px}
.legend span{display:flex;align-items:center;gap:4px}
.lg{width:10px;height:10px;border-radius:3px;display:inline-block}
.lg.red{background:var(--danger)} .lg.exam{background:#f6ef9e} .lg.note{border-bottom:2px solid var(--accent);border-radius:0;height:6px}
.lg.rep{background:var(--text)} .lg.vac{background:var(--input);border:1px solid var(--line)}
.kindbar{display:flex;gap:6px;margin-bottom:10px}
.kindbar button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px;font-weight:700;cursor:pointer;color:var(--muted)}
.kindbar button.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
.notecard{display:block;width:100%;text-align:left;border:0;cursor:pointer;font:inherit;color:inherit}
.chip{font-size:11px;font-weight:700;background:var(--input);color:var(--muted);border-radius:6px;padding:2px 6px}
.btn.danger{color:var(--danger)}
.ci.xm{color:#b45309;font-weight:700}
.kindbar button{padding:8px 4px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.filters button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.filters button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;margin-bottom:8px;font:inherit;color:inherit}
.allday h4{margin:0 0 4px;font-size:15px}
.hl{background:#fde68a;color:#000;border-radius:3px}
.bar{height:8px;background:var(--input);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
.bar.mid i{background:#e0a72e} .bar.low i{background:var(--danger)}
.dday{font-size:12px;font-weight:800;border-radius:6px;padding:2px 7px;background:var(--accent);color:#fff}
.dday.past{background:var(--input);color:var(--muted)}
.dday.soon{background:var(--danger)}
.xkind{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;background:#fef3c7;color:#92400e}
.xkind.perf{background:#dcfce7;color:#166534}
.xr{margin-top:8px}
.xr .top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.xr .pct{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.xr .memo{font-size:12px;color:var(--muted);margin-top:2px}
.xrow{background:var(--input);border-radius:10px;padding:8px;display:grid;grid-template-columns:1fr auto;gap:6px;margin-bottom:6px}
.xrow input[type=text],.xrow input:not([type]){min-width:0;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 8px}
.xrow .sl{grid-column:1/3;display:flex;align-items:center;gap:8px}
.xrow .sl input{flex:1}
.xrow .sl b{min-width:44px;text-align:right;font-variant-numeric:tabular-nums}
.xrow .m{grid-column:1/3}
.xsubs{font-size:13px;font-weight:700;margin-top:6px;word-break:keep-all}
.xsub{border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.xsub .xsh{display:flex;align-items:center;gap:6px;font-size:15px}
.xsub .xsh .sp{flex:1}
.xsub .xsh .pct{font-weight:800;font-variant-numeric:tabular-nums}
.xsub .xsd{font-size:12px;color:var(--muted)}
.xsub > .memo{font-size:12px;color:var(--muted);margin-top:4px}
.xsub.edit{border:1px solid var(--line);border-radius:12px;padding:8px;margin:0 0 8px}
.xsub.edit .xsh{margin-bottom:6px}
.xsub.edit .xsh input{min-width:0;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 8px;font:inherit;color:inherit}
.xsub.edit .xsh input:not([type]){flex:1;font-weight:700}
.xsub.edit .xsh input[type=date]{flex:none;width:9.5em}
.xsub.edit .del{border:0;background:none;color:var(--danger);font-size:22px;cursor:pointer;padding:0 6px}
.xdates{display:flex;align-items:center;gap:6px}
.xdates input{flex:1;min-width:0}
.tbgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-top:6px}
.tbgrid div{display:flex;justify-content:space-between;gap:6px;background:var(--input);border-radius:8px;padding:7px 10px;font-size:14px}
.tbgrid span{color:var(--muted)}
.tbschool{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:2px}
.tbschool small{display:block;font-weight:400;font-size:12px}
.tbpicked{display:flex;align-items:center;gap:10px;background:var(--accent-weak);border:1px solid var(--accent);border-radius:10px;padding:10px 12px;margin:4px 0 8px}
.tbpicked span{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.tbpicked small{font-size:12px;color:var(--muted);word-break:keep-all}
.tbpicked .btn{flex:none;padding:8px 10px}
.suresults{display:grid;gap:6px;margin-top:8px;max-height:50vh;overflow:auto}
.suitem{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;cursor:pointer;color:var(--text)}
.suitem .nm{font-weight:700}
.suitem i{font-style:normal;font-size:11px;font-weight:700;background:var(--input);color:var(--muted);border-radius:6px;padding:1px 5px;margin-left:4px}
.suitem em{font-style:normal;font-size:11px;font-weight:700;color:var(--danger);margin-left:4px}
.suitem .ad{font-size:12px;color:var(--muted);word-break:keep-all}
.tbgrades{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:6px 0 2px}
.tbgrades button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 0;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer}
.tbgrades button.on{background:var(--accent-weak);border-color:var(--accent);color:var(--accent)}
.tbcur{display:flex!important;align-items:center;gap:10px;background:var(--input);border-radius:10px;padding:10px 12px;margin:4px 0 8px;cursor:pointer}
.tbcur input{width:20px;height:20px;flex:none;margin:0}
.tbcur span{display:flex;flex-direction:column;gap:2px;color:var(--text)}
.tbcur small{font-size:12px;color:var(--muted);font-weight:400}
.tbrow{display:grid;grid-template-columns:1fr 1.3fr auto;gap:6px;margin-bottom:6px}
.tbrow input{min-width:0;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 8px}
.tbrow .del{border:0;background:none;color:var(--danger);font-size:22px;cursor:pointer;padding:0 6px}
.xrow .del{border:0;background:none;color:var(--danger);font-size:22px;cursor:pointer;padding:0 6px}
.rform select{width:100%;border:1px solid var(--line);background:var(--input);border-radius:8px;padding:8px;font:inherit;color:inherit}
#map{height:320px;border-radius:12px;overflow:hidden;margin-bottom:10px;z-index:0}
.plist .pl{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.plist .pl:first-child{border-top:0}
.plist .pn{flex:1;min-width:0}
.plist .pn b{display:block} .plist .pn span{font-size:12px;color:var(--muted)}
.mini-btn{border:0;background:var(--input);border-radius:8px;padding:6px 9px;font-size:13px;cursor:pointer;font-weight:600;white-space:nowrap;color:var(--text);text-decoration:none;display:inline-block}
.mini-btn.go{background:var(--accent);color:#fff}
.route{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center}
.route select{width:100%;border:1px solid var(--line);background:var(--input);border-radius:8px;padding:8px;font:inherit;color:inherit}
.rbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sres button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:8px 2px;cursor:pointer;font-size:13px;color:var(--text)}
.pin{background:none;border:0}
.lbody{line-height:1.65}
.lbody p{margin:6px 0}
.lbody ul{margin:6px 0;padding-left:20px}
.lbody code,.ltask code{background:var(--input);border-radius:5px;padding:1px 5px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.lbody table{border-collapse:collapse;margin:6px 0;font-size:13px}
.lbody td,.lbody th{border:1px solid var(--line);padding:4px 8px;text-align:left}
.lcode{width:100%;min-height:220px;border:1px solid var(--line);border-radius:10px;padding:10px;background:#1e1e2e;color:#e5e7eb;
  font:13.5px/1.55 ui-monospace,Menlo,Consolas,monospace;tab-size:4;resize:vertical;white-space:pre;overflow:auto}
.lstdin{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--input);color:inherit;font:13px ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.lout{background:#0f172a;color:#d1fae5;border-radius:10px;padding:10px;margin:8px 0 0;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:40px;max-height:320px;overflow:auto}
.lout .e{color:#fca5a5}
.lout .m{color:#94a3b8}
.lframe{width:100%;height:320px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:8px;resize:vertical;display:block}
.ltask{background:var(--accent-weak);border-radius:10px;padding:10px 12px;margin-top:12px;line-height:1.6}
.llist button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:11px 2px;cursor:pointer;color:var(--text);font:inherit}
.llist button:first-child{border-top:0}
.llist .n{width:26px;height:26px;border-radius:50%;background:var(--input);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.llist .n.ok{background:#10b981;color:#fff}
.lbar{height:8px;border-radius:4px;background:var(--input);overflow:hidden;margin:6px 0 2px}
.lbar i{display:block;height:100%;background:#10b981}
.lnav{display:flex;gap:6px;margin-top:12px}
.lnav .sp{flex:1}
.nkinds{display:grid;grid-template-columns:repeat(4,1fr)}
.nkinds button{font-size:13px;padding:8px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.3px}
.nlogo{height:1.15em;width:auto;max-width:2.6em;object-fit:contain;vertical-align:-.2em;margin-right:4px;border-radius:3px}
.nlist a{display:block;padding:10px 0;border-top:1px solid var(--line);color:var(--text);text-decoration:none}
.nlist a:first-child{border-top:0}
.nlist b{display:block;font-weight:600;line-height:1.4}
.nlist span{font-size:12px;color:var(--muted)}
.nbell{position:relative}
.nbell span{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;line-height:18px;text-align:center}
.nbell span[hidden]{display:none}
.nbell[aria-pressed="true"]{outline:2px solid var(--accent)}
.npick{display:flex;gap:8px;margin-bottom:10px}
.npick select{flex:1;min-width:0;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 10px;font:inherit;color:inherit}
.nnote{display:block;width:100%;text-align:left;border:1px solid var(--accent);background:var(--accent-weak);color:var(--accent);border-radius:12px;padding:10px 12px;margin-bottom:10px;font:inherit;font-weight:600;cursor:pointer}
.nmore{display:block;width:100%;margin-top:8px}
.kpin{position:relative;width:28px;height:28px}
.pinb{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.pinb>*{transform:rotate(45deg)}
.pinl{position:absolute;left:32px;top:2px;white-space:nowrap;font-size:12px;font-weight:700;background:#fff;color:#111;border-radius:6px;padding:1px 6px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.moremenu{position:absolute;right:16px;top:118px;z-index:20;background:var(--card);border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:6px;display:grid;min-width:190px}
.moremenu[hidden]{display:none}
.moremenu button{border:0;background:none;text-align:left;padding:11px 12px;border-radius:8px;font-weight:600;cursor:pointer;color:var(--text)}
.moremenu button[aria-selected="true"]{background:var(--accent-weak);color:var(--accent)}
#moreBtn{white-space:nowrap}
#moreBtn[aria-selected="true"]{background:var(--grad);color:#fff}
header .wrap{position:relative}
.cand{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.cand:first-of-type{border-top:0}
.cand input{margin-top:3px;width:18px;height:18px;flex:none}
.cand .src{font-size:12px;color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);
  padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
#toast.show{opacity:1}
.panel{background:var(--card);border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow);padding:16px;margin:12px 0}
.panel h2{margin:0 0 8px;font-size:17px}
.panel ol{padding-left:20px;margin:8px 0} .panel li{margin:4px 0}
.panel input{width:100%;border:1px solid var(--line);background:var(--input);border-radius:8px;padding:10px;margin:8px 0}
.btn{border:0;border-radius:12px;padding:10px 14px;background:var(--ok);color:#fff;font-weight:700;cursor:pointer;box-shadow:0 4px 12px color-mix(in srgb,var(--ok) 28%,transparent)}
.btn.ghost,.btn.danger{box-shadow:none}
.btn.ghost{background:var(--card);color:var(--accent);border:1.5px solid var(--accent)}
.btn.ghost.danger{color:var(--danger);border-color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
a{color:var(--accent)}
.wform{display:flex;gap:8px;align-items:flex-start}
.wform .search{flex:1;min-width:0}
.wform .btn{flex:none;padding:9px 14px}
.wsug{display:grid;gap:6px;margin-top:6px}
.wsug button{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);background:var(--input);border-radius:10px;padding:9px 11px;cursor:pointer;color:var(--text);font:inherit}
.wsug b{font-weight:700} .wsug span{font-size:12px;color:var(--muted)}
.wsum img{float:right;width:96px;max-height:120px;object-fit:cover;border-radius:10px;margin:0 0 6px 10px}
.wsum::after{content:"";display:block;clear:both}
.rbtns a.mini-btn{text-decoration:none}
.err{color:var(--danger);font-size:13px;white-space:pre-wrap}
.loading{text-align:center;color:var(--muted);padding:40px 0}
/* ---------- 🗞️ 헤드라인 (뉴스 탭 맨 위) ---------- */
.hline{margin-bottom:10px}
.hl-h{display:flex;align-items:baseline;gap:8px;margin:2px 2px 8px}
.hl-h .empty{margin:0}
.hl-g{display:grid;grid-template-columns:1fr;gap:8px}
.hl-c{display:flex;flex-direction:column;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
  padding:11px 13px;color:var(--text);text-decoration:none;min-width:0}
.hl-c b{font-weight:700;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hl-k{font-size:12px;font-weight:700;color:var(--accent)}
.hl-m{font-size:12px;color:var(--muted);margin-top:auto}
.hl-c.big{background:linear-gradient(135deg,var(--accent-weak),var(--card) 75%);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
.hl-c.big b{font-size:18px;font-weight:800;letter-spacing:-.3px}
.hl-c:nth-child(n+6){display:none}                       /* 📱 스마트폰: 5개 */
@media (hover:hover){.hl-c:hover{border-color:var(--accent)} .nlist a:hover b{color:var(--accent)}}

/* ---------- 📐 반응형: 📱 스마트폰(기본) · 📲 태블릿(760px~) · 🖥️ PC(1100px~) ---------- */
img,iframe,video,table{max-width:100%}
@media (max-width:379px){                                  /* 작은 스마트폰 */
  .wrap{padding:0 12px}
  .top h1{font-size:18px}
  .icon-btn{width:36px;height:36px;font-size:16px}
  .tabs button{font-size:13.5px}
  .nkinds{grid-template-columns:repeat(3,1fr)}
  .cell{min-height:56px}
}
@media (min-width:760px){                                  /* 태블릿 */
  .wrap{max-width:900px;padding:0 24px}
  body{font-size:15.5px}
  .top h1{font-size:22px}
  .tabs button{font-size:15.5px;padding:9px 0}
  .moremenu{right:24px}
  .day,.panel{padding:14px 18px}
  .nkinds{grid-template-columns:repeat(6,1fr)}
  .hl-g{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hl-c.big{grid-column:span 2}
  .hl-c.big b{font-size:20px}
  .hl-c:nth-child(-n+7){display:flex}                     /* 7개 */
  .cell{min-height:80px;padding:3px 4px}
  .cell .n{font-size:13px}
  .ci{font-size:11px}
  .ygrid{grid-template-columns:repeat(4,1fr)}
  .mh span{font-size:10px} .mg button,.mg span{font-size:11.5px;padding:3px 0}
  /* 주간: 하루 카드 2개씩 */
  body[data-mode="week"] #view{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px;align-items:start}
  body[data-mode="week"] #view>.note,body[data-mode="week"] #view>.grit,body[data-mode="week"] #view>.loading,body[data-mode="week"] #view>.err{grid-column:1/-1}
  /* 공지: 분야 카드 2개씩 */
  body[data-mode="notice"] #view{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px;align-items:start}
  body[data-mode="notice"] #view>:first-child,body[data-mode="notice"] #view>.loading{grid-column:1/-1}
}
@media (min-width:1100px){                                 /* PC */
  .wrap{max-width:1240px;padding:0 32px}
  /* 글이 많은 화면은 너무 넓으면 읽기 힘들어서 가운데 좁게 */
  body:not([data-mode="week"]):not([data-mode="month"]):not([data-mode="year"]):not([data-mode="news"]):not([data-mode="notice"]):not([data-mode="map"]) main.wrap{max-width:960px}
  /* 머리: 탭 옆에 메뉴 항목을 펼쳐서 바로 누르게 */
  header .wrap{display:grid;grid-template-columns:minmax(380px,460px) 1fr;column-gap:16px;align-items:center}
  header .top,header .navrow{grid-column:1/-1}
  #moreBtn{display:none}
  .moremenu,.moremenu[hidden]{display:flex;flex-wrap:wrap;gap:6px;position:static;background:none;box-shadow:none;padding:0;min-width:0}
  .moremenu button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13.5px}
  .moremenu button[aria-selected="true"]{background:var(--accent-weak);border-color:var(--accent)}
  .nkinds{grid-template-columns:repeat(9,1fr)}
  .hl-g{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hl-c:nth-child(-n+8){display:flex}                     /* 8개 */
  .hl-c.big b{font-size:22px}
  body[data-mode="news"] #nres .nlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
  body[data-mode="news"] #nres .nlist a:nth-child(2){border-top:0}
  .cell{min-height:104px}
  .ci{font-size:12px}
  .ygrid{grid-template-columns:repeat(6,1fr)}
  /* 주간: 3개씩 */
  body[data-mode="week"] #view{grid-template-columns:repeat(3,minmax(0,1fr));gap:0 14px}
  /* 월간: 달력은 왼쪽 크게, 고른 날·메모는 오른쪽 */
  body[data-mode="month"] #view{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:0 16px;align-items:start}
  body[data-mode="month"] #view>.note,body[data-mode="month"] #view>.goal,body[data-mode="month"] #view>.loading,body[data-mode="month"] #view>.err{grid-column:1/-1}
  body[data-mode="month"] #view>.cal{grid-column:1}
  body[data-mode="month"] #view>.mside{grid-column:2}
  /* 공지: 3개씩 */
  body[data-mode="notice"] #view{grid-template-columns:repeat(3,minmax(0,1fr))}
}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top">
    <h1>📅 <span class="gt">내 계획표</span></h1>
    <button class="icon-btn nbell" id="noticeBtn" title="공지 (새 뉴스)" aria-label="공지">📢<span id="noticeCnt" hidden></span></button>
    <button class="icon-btn" id="reload" title="새로고침 (앱 업데이트 받기)" aria-label="새로고침">↻</button>
    <button class="icon-btn" id="openSettings" title="설정" aria-label="설정">⚙️</button>
  </div>
  <div class="tabs" role="tablist">
    <button role="tab" data-mode="today" aria-selected="false">오늘</button>
    <button role="tab" data-mode="week" aria-selected="true">주간</button>
    <button role="tab" data-mode="month" aria-selected="false">월간</button>
    <button role="tab" data-mode="report" aria-selected="false">보고서</button>
    <button id="moreBtn" aria-haspopup="true" aria-expanded="false">☰ 메뉴</button>
  </div>
  <div id="moreMenu" class="moremenu" hidden>
    <button data-mode="exam">📝 시험 범위·진도</button>
    <button data-mode="weak">🩹 과목별 부족한 점</button>
    <button data-mode="books">📚 교과서 출판사</button>
    <button data-mode="year">📆 연간 계획</button>
    <button data-mode="map">🗺️ 지도·길찾기</button>
    <button data-mode="news">📰 뉴스</button>
    <button data-mode="learn">💻 코딩 공부</button>
    <button data-mode="web">🔎 찾아보기 (인터넷 검색)</button>
  </div>
  <div class="navrow">
    <button class="icon-btn" id="prev" aria-label="이전">‹</button>
    <div class="labelwrap"><div class="label" id="label"></div>
      <button class="todaybtn" id="goToday" hidden>↩ 오늘로</button></div>
    <button class="icon-btn" id="next" aria-label="다음">›</button>
  </div>
</div></header>

<main class="wrap" id="view"><div class="loading">불러오는 중…</div></main>

<div id="toast" role="status"></div>

<script src="app.js"></script>
</body>
</html>
