name: 사이트 배포 다시 하기

# GitHub Pages 배포가 GitHub 쪽 문제로 가끔 시간 초과(실패)돼서
# 새 뉴스가 저장돼도 사이트에 안 보이는 일이 있어요.
# 배포가 실패하면 자동으로 다시 해요 (같은 배포는 최대 3번까지).
on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  schedule:
    - cron: "37 * * * *"     # 위 신호를 놓쳤을 때를 위해 매시간 한 번 더 살펴봐요
  workflow_dispatch:

permissions:
  actions: write             # 실패한 배포 다시 실행
  contents: read

concurrency:
  group: pages-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 실패한 배포가 있으면 다시 하기
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}            # 예약·workflow_run 은 늘 기본 브랜치에서 돌아요
        run: |
          set -euo pipefail
          MAX=3
          head=$(gh api "repos/$R/commits/$BRANCH" --jq .sha)
          # 지금 브랜치 맨 위 커밋의 가장 최근 배포 기록
          run=$(gh api "repos/$R/actions/runs?branch=$BRANCH&head_sha=$head&per_page=50" \
            --jq '[.workflow_runs[] | select(.name == "pages build and deployment")] | first // empty')
          if [ -z "$run" ]; then echo "최신 커밋의 배포 기록이 아직 없어요"; exit 0; fi
          id=$(jq -r .id <<<"$run"); status=$(jq -r .status <<<"$run")
          conclusion=$(jq -r .conclusion <<<"$run"); attempt=$(jq -r .run_attempt <<<"$run")
          echo "배포 $id: $status / $conclusion (시도 $attempt번)"
          if [ "$status" != "completed" ]; then echo "아직 배포 중이에요"; exit 0; fi
          case "$conclusion" in
            failure|timed_out) ;;
            *) echo "다시 할 필요 없어요"; exit 0 ;;
          esac
          if [ "$attempt" -ge "$MAX" ]; then echo "::warning::배포가 $MAX번 실패했어요. Actions 탭에서 확인해 주세요."; exit 0; fi
          echo "배포를 다시 해요"
          gh api -X POST "repos/$R/actions/runs/$id/rerun-failed-jobs" \
            || gh api -X POST "repos/$R/actions/runs/$id/rerun"
