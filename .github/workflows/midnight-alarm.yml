name: 알람 예약

on:
  schedule:
    # GitHub cron은 UTC 기준. GitHub 사정으로 몇 분~몇 시간 늦게 실행될 수 있어서
    # 전날 밤에 미리 예약하고, 자정 실행은 보고서 복습 알림 + (밤 실행 실패 시) 대신 예약
    - cron: "0 13 * * *"   # 한국 22:00 → 내일 알람 미리 예약
    - cron: "0 15 * * *"   # 한국 00:00 → 어제 보고서 외울 것 / 밤 예약이 안 됐으면 오늘 알람 예약
  workflow_dispatch:      # Actions 탭에서 수동 실행(테스트)용
    inputs:
      force:
        description: "오늘 이미 예약했어도 다시 예약 (알람이 두 번 올 수 있어요)"
        type: boolean
        default: false

# 🔒 데이터는 Supabase 에만 있어요. 이 작업은 저장소에 아무것도 쓰지 않으니 읽기 권한만.
# (예전 '저장소 파일 방식'은 개인 계획표를 공개 저장소에 커밋해서 없앴어요)
permissions:
  contents: read

concurrency:
  group: midnight-alarm
  cancel-in-progress: false

jobs:
  schedule-alarms:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false   # push 할 일이 없으니 GitHub 토큰을 디스크에 남기지 않아요
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: 알람 예약 (Supabase 계정마다)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE: ${{ inputs.force && '--force' || '' }}
        # 공개 저장소라 Actions 로그도 누구나 볼 수 있어요 → 일정 내용·이메일·토픽은 로그에 안 찍어요 (개수만)
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::error::GitHub Secrets 에 SUPABASE_URL 과 SUPABASE_SERVICE_KEY 를 넣어 주세요 (SUPABASE_SETUP.md 3번)"
            exit 1
          fi
          python run_supabase.py $FORCE
