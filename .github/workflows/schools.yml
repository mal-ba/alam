name: 전국 학교 목록 모으기

on:
  schedule:
    - cron: "43 18 3 * *"   # 매달 4일 새벽 3:43 (KST) — 공공데이터 → docs/schools.json
  workflow_dispatch:          # Actions 탭에서 바로 실행

permissions:
  contents: write

concurrency:
  group: schools
  cancel-in-progress: true

jobs:
  schools:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python schools.py
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          NEIS_KEY: ${{ secrets.NEIS_KEY }}
      - name: 저장(커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/schools.json
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "학교 목록 업데이트 ($(TZ=Asia/Seoul date '+%F'))"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
