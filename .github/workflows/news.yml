name: 뉴스 모으기

on:
  schedule:
    # GitHub 예약 실행은 자주 늦어지거나 건너뛰어져서, 매시간 깨우고
    # news.py 가 마지막 업데이트 뒤 2시간 50분이 지났을 때만 새로 모아요 (= 3시간마다)
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:          # Actions 탭에서 바로 실행 (시간 상관없이 바로 모음)

permissions:
  contents: write

concurrency:
  group: news                # news-archive.yml 과 같은 파일을 고치니 하나씩 차례로
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python news.py
        env:
          NEWS_MIN_GAP_MIN: ${{ github.event_name == 'schedule' && '170' || '0' }}
      - name: 저장(커밋)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/news.json docs/news
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "뉴스 업데이트 ($(TZ=Asia/Seoul date '+%F %H:%M'))"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
