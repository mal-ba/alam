name: 뉴스 모으기

on:
  schedule:
    # GitHub 예약 실행은 자주 늦어지거나 건너뛰어져서, 매시간 깨우고
    # news.py 가 마지막 업데이트 뒤 2시간 50분이 지났을 때만 새로 모아요 (= 3시간마다)
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:          # Actions 탭에서 바로 실행 (시간 상관없이 바로 모음)

permissions:
  contents: write
  actions: write             # 저장 뒤 '사이트 배포 다시 하기' 부르기

concurrency:
  group: news                # news-archive.yml 과 같은 파일을 고치니 하나씩 차례로
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python news.py
        env:
          NEWS_MIN_GAP_MIN: ${{ github.event_name == 'schedule' && '170' || '0' }}
      - name: 저장(커밋)
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/news.json docs/news
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "뉴스 업데이트 ($(TZ=Asia/Seoul date '+%F %H:%M'))"
          for i in 1 2 3 4 5 6; do
            # 다른 작업이 먼저 저장했으면 그 위에 올리고, 자동으로 만드는 index.json 은 다시 만들어요
            if git pull --rebase --autostash -X theirs; then
              python -c "import news; news.write_index()"
              git add docs/news/index.json
              git diff --cached --quiet || git commit -q -m "뉴스 보관함 목록"
              git push && { echo "pushed=1" >> "$GITHUB_OUTPUT"; exit 0; }
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((RANDOM % 10 + 5))
          done
          exit 1
      - name: 사이트 배포 지켜보기 (실패하면 다시 하기)
        if: steps.save.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages-retry.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
